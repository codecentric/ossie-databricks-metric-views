name: sales
description: Sales orders with customer attributes
tables:
- name: sales
  base_table:
    database: SAMPLES
    schema: TPCH
    table: ORDERS
- name: customer
  base_table:
    database: SAMPLES
    schema: TPCH
    table: CUSTOMER
  unique_keys:
  - columns:
    - c_custkey
relationships:
- name: sales_to_customer
  left_table: sales
  right_table: customer
  relationship_columns:
  - left_column: o_custkey
    right_column: c_custkey
